<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="6in" height="4in" viewBox="0 0 900 520" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrEC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#0033A0"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0033A0">Why classic discovery stalls on EHR</text>

  <!-- Three small DAGs, horizontally arranged with breathing room -->
  <g id="dag1" transform="translate(60, 110)">
    <circle cx="0"  cy="30" r="20" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="0"  y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">X</text>
    <circle cx="100" cy="30" r="20" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="100" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Y</text>
    <circle cx="200" cy="30" r="20" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="200" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Z</text>
    <line x1="22"  y1="30" x2="78"  y2="30" stroke="#0033A0" stroke-width="3" marker-end="url(#arrEC)"/>
    <line x1="122" y1="30" x2="178" y2="30" stroke="#0033A0" stroke-width="3" marker-end="url(#arrEC)"/>
    <text x="100" y="96" text-anchor="middle" font-size="16" fill="#3F4444" font-style="italic">X → Y → Z</text>
  </g>

  <g id="dag2" transform="translate(350, 110)">
    <circle cx="0"  cy="30" r="20" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="0"  y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">X</text>
    <circle cx="100" cy="30" r="20" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="100" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Y</text>
    <circle cx="200" cy="30" r="20" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="200" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Z</text>
    <line x1="78"  y1="30" x2="22"  y2="30" stroke="#0033A0" stroke-width="3" marker-end="url(#arrEC)"/>
    <line x1="122" y1="30" x2="178" y2="30" stroke="#0033A0" stroke-width="3" marker-end="url(#arrEC)"/>
    <text x="100" y="96" text-anchor="middle" font-size="16" fill="#3F4444" font-style="italic">X ← Y → Z</text>
  </g>

  <g id="dag3" transform="translate(640, 110)">
    <circle cx="0"  cy="30" r="20" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="0"  y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">X</text>
    <circle cx="100" cy="30" r="20" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="100" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Y</text>
    <circle cx="200" cy="30" r="20" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="200" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Z</text>
    <line x1="78"  y1="30" x2="22"  y2="30" stroke="#0033A0" stroke-width="3" marker-end="url(#arrEC)"/>
    <line x1="178" y1="30" x2="122" y2="30" stroke="#0033A0" stroke-width="3" marker-end="url(#arrEC)"/>
    <text x="100" y="96" text-anchor="middle" font-size="16" fill="#3F4444" font-style="italic">X ← Y ← Z</text>
  </g>

  <!-- Bracket spanning all three -->
  <path d="M 40 260 Q 40 250 50 250 L 850 250 Q 860 250 860 260" stroke="#005DAA" stroke-width="3" fill="none"/>
  <line x1="450" y1="260" x2="450" y2="286" stroke="#005DAA" stroke-width="3"/>

  <!-- Equivalence label -->
  <g transform="translate(450, 320)">
    <rect x="-300" y="-24" width="600" height="52" rx="10" fill="#F6F8FC" stroke="#005DAA" stroke-width="2.5"/>
    <text x="0" y="10" text-anchor="middle" font-size="20" font-weight="700" fill="#0033A0">Same CPDAG — indistinguishable without time</text>
  </g>

  <!-- Big navy ? -->
  <text x="450" y="402" text-anchor="middle" font-size="44" font-weight="700" fill="#0033A0">?</text>

  <!-- Caption -->
  <text x="450" y="450" text-anchor="middle" font-size="17" fill="#3F4444" font-style="italic">Classic PC / GES cannot orient these edges.</text>
  <text x="450" y="476" text-anchor="middle" font-size="17" fill="#3F4444" font-style="italic">Temporal precedence can.</text>
</svg>
