<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="14in" height="8in" viewBox="0 0 1680 960" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrNavyC" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#005DAA"/>
    </marker>
    <marker id="arrOrangeC" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#D64309"/>
    </marker>
    <marker id="arrGrayC" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#8a94a6"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="1680" height="70" fill="#F6F8FC"/>
  <text x="40"   y="42" font-size="22" font-weight="700" fill="#0033A0" letter-spacing="0.08em">SCENARIO 4</text>
  <text x="210"  y="42" font-size="24" font-weight="700" fill="#3F4444">Breast-cancer risk: life-course ordering</text>
  <text x="1640" y="42" text-anchor="end" font-size="14" font-style="italic" fill="#8a94a6">modifiable vs. immutable factors</text>

  <!-- ====== LEFT PANEL: flat ====== -->
  <g id="flatPanel">
    <text x="40" y="110" font-size="18" font-weight="700" fill="#8a94a6" letter-spacing="0.1em">FLAT · CROSS-SECTIONAL</text>
    <text x="40" y="138" font-size="15" fill="#3F4444" font-style="italic">a row of risk factors &amp; outcome, no history</text>

    <!-- Table -->
    <g font-size="13" fill="#3F4444">
      <rect x="40" y="160" width="620" height="32" fill="#0033A0"/>
      <text x="55"  y="180" font-weight="700" fill="#fff">id</text>
      <text x="115" y="180" font-weight="700" fill="#fff">family_hx</text>
      <text x="250" y="180" font-weight="700" fill="#fff">menarche</text>
      <text x="380" y="180" font-weight="700" fill="#fff">parity</text>
      <text x="470" y="180" font-weight="700" fill="#fff">HRT</text>
      <text x="560" y="180" font-weight="700" fill="#fff">BC</text>

      <rect x="40" y="192" width="620" height="26" fill="#ffffff" stroke="#CDCDCD" stroke-width="1"/>
      <text x="55"  y="210">4012</text>
      <text x="115" y="210">1</text>
      <text x="250" y="210">11</text>
      <text x="380" y="210">0</text>
      <text x="470" y="210">1</text>
      <text x="560" y="210">1</text>

      <rect x="40" y="218" width="620" height="26" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="1"/>
      <text x="55"  y="236">4108</text>
      <text x="115" y="236">0</text>
      <text x="250" y="236">13</text>
      <text x="380" y="236">2</text>
      <text x="470" y="236">0</text>
      <text x="560" y="236">0</text>

      <rect x="40" y="244" width="620" height="26" fill="#ffffff" stroke="#CDCDCD" stroke-width="1"/>
      <text x="55"  y="262">4193</text>
      <text x="115" y="262">0</text>
      <text x="250" y="262">14</text>
      <text x="380" y="262">1</text>
      <text x="470" y="262">1</text>
      <text x="560" y="262">1</text>

      <rect x="40" y="270" width="620" height="26" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="1"/>
      <text x="55"  y="288">4284</text>
      <text x="115" y="288">1</text>
      <text x="250" y="288">12</text>
      <text x="380" y="288">0</text>
      <text x="470" y="288">1</text>
      <text x="560" y="288">1</text>

      <rect x="40" y="296" width="620" height="26" fill="#ffffff" stroke="#CDCDCD" stroke-width="1"/>
      <text x="55"  y="314">4377</text>
      <text x="115" y="314">0</text>
      <text x="250" y="314">12</text>
      <text x="380" y="314">3</text>
      <text x="470" y="314">0</text>
      <text x="560" y="314">0</text>

      <text x="350" y="346" text-anchor="middle" font-size="22" fill="#CDCDCD">· · ·</text>
    </g>

    <!-- Dense undirected graph (CPDAG) -->
    <rect x="40" y="380" width="620" height="220" rx="10" fill="#ffffff" stroke="#CDCDCD" stroke-width="2"/>
    <text x="350" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#3F4444" letter-spacing="0.08em">DENSE UNDIRECTED CPDAG</text>

    <!-- Nodes in a star layout around BC -->
    <g transform="translate(130, 430)">
      <!-- BC (center bottom) -->
      <circle cx="230" cy="140" r="28" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
      <circle cx="230" cy="140" r="22" fill="#ffffff" stroke="#0033A0" stroke-width="1.5"/>
      <text x="230" y="144" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">BC</text>

      <!-- Family history (top-left) -->
      <circle cx="40" cy="30" r="25" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
      <text x="40" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0033A0">fam_hx</text>
      <text x="40" y="41" text-anchor="middle" font-size="9" fill="#3F4444">genetic</text>

      <!-- Menarche (top-center) -->
      <circle cx="150" cy="20" r="25" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
      <text x="150" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#0033A0">menar.</text>
      <text x="150" y="31" text-anchor="middle" font-size="9" fill="#3F4444">age of</text>

      <!-- Parity (top-right-center) -->
      <circle cx="310" cy="20" r="25" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
      <text x="310" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#0033A0">parity</text>
      <text x="310" y="31" text-anchor="middle" font-size="9" fill="#3F4444">births</text>

      <!-- HRT (top-right) -->
      <circle cx="420" cy="30" r="25" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
      <text x="420" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#0033A0">HRT</text>
      <text x="420" y="41" text-anchor="middle" font-size="9" fill="#3F4444">hormone</text>

      <!-- Undirected edges — dense web -->
      <line x1="60"  y1="50"  x2="210" y2="125" stroke="#8a94a6" stroke-width="2"/>
      <line x1="150" y1="46"  x2="225" y2="112" stroke="#8a94a6" stroke-width="2"/>
      <line x1="310" y1="46"  x2="240" y2="112" stroke="#8a94a6" stroke-width="2"/>
      <line x1="400" y1="50"  x2="250" y2="125" stroke="#8a94a6" stroke-width="2"/>
      <!-- interconnecting edges between factors -->
      <line x1="62"  y1="32"  x2="126" y2="22" stroke="#CDCDCD" stroke-width="1.5"/>
      <line x1="172" y1="22"  x2="290" y2="22" stroke="#CDCDCD" stroke-width="1.5"/>
      <line x1="332" y1="26"  x2="398" y2="32" stroke="#CDCDCD" stroke-width="1.5"/>
      <line x1="60"  y1="50"  x2="395" y2="50" stroke="#CDCDCD" stroke-width="1" stroke-dasharray="3 4"/>
    </g>

    <text x="350" y="586" text-anchor="middle" font-size="13" fill="#8a94a6" font-style="italic">Cross-section can’t tell which risks are immutable and which are levers.</text>

    <!-- Why -->
    <rect x="40" y="620" width="620" height="90" rx="8" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="2"/>
    <text x="60" y="650" font-size="13" font-weight="700" fill="#3F4444">Why it matters:</text>
    <text x="60" y="674" font-size="13" fill="#3F4444">Family history is fixed at birth. HRT is a policy lever. Collapsing them into</text>
    <text x="60" y="694" font-size="13" fill="#3F4444">one row conflates effect sizes that carry totally different clinical implications.</text>
  </g>

  <!-- Middle reshape -->
  <g transform="translate(760, 380)">
    <rect x="0" y="0" width="160" height="90" rx="45" fill="#ffffff" stroke="#005DAA" stroke-width="3"/>
    <text x="80" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">life-course</text>
    <text x="80" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">object</text>
    <line x1="-20" y1="45" x2="0"   y2="45" stroke="#005DAA" stroke-width="5"/>
    <line x1="160" y1="45" x2="186" y2="45" stroke="#005DAA" stroke-width="5" marker-end="url(#arrNavyC)"/>
  </g>

  <!-- ====== RIGHT PANEL: longitudinal ====== -->
  <g id="longPanel">
    <text x="960" y="110" font-size="18" font-weight="700" fill="#0033A0" letter-spacing="0.1em">LONGITUDINAL · OBJECT-CENTRIC</text>
    <text x="960" y="138" font-size="15" fill="#3F4444" font-style="italic">Patient object · dated life-course events</text>

    <!-- Life timeline -->
    <rect x="960" y="160" width="680" height="210" rx="10" fill="#ffffff" stroke="#CDCDCD" stroke-width="2"/>
    <text x="980" y="188" font-size="13" font-weight="700" fill="#3F4444" letter-spacing="0.06em">PATIENT 4012 · LIFE-COURSE EVENTS</text>

    <!-- Axis -->
    <line x1="990" y1="280" x2="1620" y2="280" stroke="#CDCDCD" stroke-width="2"/>
    <line x1="1010" y1="276" x2="1010" y2="284" stroke="#8a94a6"/>
    <text x="1010" y="306" text-anchor="middle" font-size="11" fill="#8a94a6">birth</text>
    <line x1="1130" y1="276" x2="1130" y2="284" stroke="#8a94a6"/>
    <text x="1130" y="306" text-anchor="middle" font-size="11" fill="#8a94a6">age 12</text>
    <line x1="1280" y1="276" x2="1280" y2="284" stroke="#8a94a6"/>
    <text x="1280" y="306" text-anchor="middle" font-size="11" fill="#8a94a6">age 28</text>
    <line x1="1430" y1="276" x2="1430" y2="284" stroke="#8a94a6"/>
    <text x="1430" y="306" text-anchor="middle" font-size="11" fill="#8a94a6">age 48</text>
    <line x1="1580" y1="276" x2="1580" y2="284" stroke="#8a94a6"/>
    <text x="1580" y="306" text-anchor="middle" font-size="11" fill="#8a94a6">age 52</text>

    <!-- fam hx immutable (at birth) -->
    <rect x="995" y="270" width="22" height="22" fill="#8a94a6"/>
    <text x="1006" y="247" text-anchor="middle" font-size="11" font-weight="700" fill="#8a94a6">fam hx</text>
    <text x="1006" y="232" text-anchor="middle" font-size="10" fill="#8a94a6">immutable</text>

    <!-- Menarche -->
    <circle cx="1130" cy="280" r="12" fill="#0033A0"/>
    <text x="1130" y="247" text-anchor="middle" font-size="11" font-weight="700" fill="#0033A0">menarche</text>

    <!-- First birth (parity) -->
    <circle cx="1280" cy="280" r="12" fill="#0033A0"/>
    <text x="1280" y="247" text-anchor="middle" font-size="11" font-weight="700" fill="#0033A0">first birth</text>

    <!-- HRT start -->
    <circle cx="1430" cy="280" r="12" fill="#0033A0"/>
    <text x="1430" y="247" text-anchor="middle" font-size="11" font-weight="700" fill="#0033A0">HRT start</text>

    <!-- Diagnosis -->
    <circle cx="1580" cy="280" r="14" fill="#D64309"/>
    <text x="1580" y="247" text-anchor="middle" font-size="11" font-weight="700" fill="#D64309">BC dx</text>

    <text x="1300" y="346" text-anchor="middle" font-size="12" fill="#8a94a6" font-style="italic">immutable-at-birth + dated events = constraints on orientation</text>

    <!-- Oriented life-course DAG -->
    <rect x="960" y="400" width="680" height="180" rx="10" fill="#ffffff" stroke="#005DAA" stroke-width="2"/>
    <text x="1300" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0" letter-spacing="0.08em">ORIENTED LIFE-COURSE DAG</text>

    <g transform="translate(990, 455)">
      <!-- fam hx -->
      <rect x="0" y="50" width="90" height="42" rx="6" fill="#F6F8FC" stroke="#8a94a6" stroke-width="2"/>
      <text x="45" y="68" text-anchor="middle" font-size="11" font-weight="700" fill="#3F4444">fam hx</text>
      <text x="45" y="82" text-anchor="middle" font-size="9" fill="#8a94a6" font-style="italic">at birth</text>

      <circle cx="160" cy="71" r="24" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
      <text x="160" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#0033A0">menar.</text>

      <circle cx="260" cy="71" r="24" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
      <text x="260" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#0033A0">parity</text>

      <circle cx="370" cy="71" r="26" fill="#ffffff" stroke="#D64309" stroke-width="3"/>
      <text x="370" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#D64309">HRT</text>

      <circle cx="510" cy="71" r="30" fill="#D64309" stroke="#D64309" stroke-width="3"/>
      <text x="510" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">BC dx</text>

      <!-- edges along timeline -->
      <line x1="90"  y1="71" x2="136" y2="71" stroke="#005DAA" stroke-width="2.5" marker-end="url(#arrNavyC)"/>
      <line x1="184" y1="71" x2="236" y2="71" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyC)"/>
      <line x1="284" y1="71" x2="344" y2="71" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyC)"/>
      <line x1="396" y1="71" x2="480" y2="71" stroke="#D64309" stroke-width="3.5" marker-end="url(#arrOrangeC)"/>

      <!-- bypass edges from fam hx and menarche straight to BC -->
      <path d="M 45 50 C 150 -10, 430 -10, 500 40" fill="none" stroke="#005DAA" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrNavyC)"/>
      <text x="260" y="10" text-anchor="middle" font-size="10" fill="#8a94a6" font-style="italic">fam hx → BC (direct path)</text>
    </g>

    <!-- Resolves -->
    <rect x="960" y="620" width="680" height="90" rx="8" fill="#FFF4E6" stroke="#D64309" stroke-width="2"/>
    <text x="980"  y="650" font-size="13" font-weight="700" fill="#D64309">What temporal precedence + immutability resolves:</text>
    <text x="980"  y="674" font-size="13" fill="#3F4444">Only HRT is a modifiable <tspan font-weight="700">late</tspan> event. The other edges point outward from</text>
    <text x="980"  y="694" font-size="13" fill="#3F4444">genetic/developmental nodes — they can’t absorb credit that belongs to HRT.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 770)">
    <rect x="0" y="0" width="1600" height="150" rx="10" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="1"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#0033A0" letter-spacing="0.08em">WHAT THE OBJECT MODEL CARRIES THAT THE FLAT TABLE DOES NOT</text>

    <g transform="translate(20, 54)">
      <rect x="0" y="0" width="24" height="14" fill="#8a94a6"/>
      <text x="36" y="12" font-size="12" fill="#3F4444"><tspan font-weight="700">Immutability at birth</tspan> — family history can only be a <tspan font-style="italic">source</tspan>, never a sink.</text>
    </g>
    <g transform="translate(20, 78)">
      <rect x="0" y="0" width="24" height="14" fill="#0033A0"/>
      <text x="36" y="12" font-size="12" fill="#3F4444"><tspan font-weight="700">Developmental timestamps</tspan> — menarche &amp; first birth anchor to specific ages, not flags.</text>
    </g>
    <g transform="translate(20, 102)">
      <rect x="0" y="0" width="24" height="14" fill="#D64309"/>
      <text x="36" y="12" font-size="12" fill="#3F4444"><tspan font-weight="700">Policy-lever events</tspan> — HRT start dates separable from diagnosis, so the modifiable edge is identifiable.</text>
    </g>
    <text x="1580" y="128" text-anchor="end" font-size="11" font-style="italic" fill="#8a94a6">Xplain Data cancer-risk example · schematic · life-course epidemiology</text>
  </g>
</svg>
