<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10.5in" height="6.2in" viewBox="0 0 1050 620" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrMid" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#D64309"/>
    </marker>
  </defs>

  <!-- Title + subtitle -->
  <text x="525" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0033A0">Correlation is not the contribution the algorithm ranks on</text>
  <text x="525" y="66" text-anchor="middle" font-size="16" font-style="italic" fill="#3F4444">The engine promotes an edge only after pre-index time constraints and competing explanations.</text>

  <!-- ========= LEFT CARD: ASSOCIATION ========= -->
  <rect x="25" y="100" width="440" height="480" rx="10" fill="#ECEEF1" stroke="#8A94A6" stroke-width="2.5"/>

  <text x="50" y="132" font-size="16" font-weight="700" letter-spacing="1.2" fill="#8A94A6">ASSOCIATION</text>
  <text x="50" y="164" font-size="20" font-weight="700" fill="#3F4444">Raw correlation with outcome</text>

  <!-- Formula -->
  <rect x="50" y="184" width="390" height="44" rx="6" fill="#ffffff" stroke="#8A94A6" stroke-width="1.5"/>
  <text x="245" y="212" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#8A94A6">P(Y=1|X=1) − P(Y=1|X=0)</text>

  <!-- Description -->
  <text x="50" y="252" font-size="16" fill="#3F4444">
    <tspan x="50" dy="0">Marginal difference in outcome rates between</tspan>
    <tspan x="50" dy="20">factor-positive and factor-negative patients.</tspan>
  </text>

  <!-- What it picks up -->
  <rect x="50" y="320" width="390" height="170" rx="6" fill="#ffffff" stroke="#CDCDCD" stroke-width="1.5"/>
  <text x="64" y="344" font-size="16" font-weight="700" fill="#3F4444">Picks up any signal moving with Y:</text>
  <text x="64" y="374" font-size="16" fill="#3F4444">•  genuine upstream cause</text>
  <text x="64" y="400" font-size="16" fill="#3F4444">•  downstream effect (reverse)</text>
  <text x="64" y="426" font-size="16" fill="#3F4444">•  severity marker (confounded)</text>
  <text x="64" y="452" font-size="16" fill="#3F4444">•  shared-cause proxy</text>
  <text x="64" y="478" font-size="16" fill="#3F4444">•  bystander (unrelated)</text>

  <!-- Example -->
  <rect x="50" y="510" width="390" height="54" rx="6" fill="#F6F8FC" stroke="#8A94A6" stroke-width="1"/>
  <text x="245" y="532" text-anchor="middle" font-size="16" font-style="italic" fill="#8A94A6">
    <tspan x="245" dy="0">"Hypoalbuminemia 5× more common</tspan>
    <tspan x="245" dy="18">in patients who develop HAPrI."</tspan>
  </text>

  <!-- ARROW between panels -->
  <text x="525" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#D64309">prune by</text>
  <text x="525" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#D64309">time +</text>
  <text x="525" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#D64309">competing</text>
  <text x="525" y="362" text-anchor="middle" font-size="16" font-weight="700" fill="#D64309">explanations</text>
  <line x1="495" y1="380" x2="555" y2="380" stroke="#D64309" stroke-width="4" marker-end="url(#arrMid)"/>

  <!-- ========= RIGHT CARD: CAUSAL CONTRIBUTION ========= -->
  <rect x="585" y="100" width="440" height="480" rx="10" fill="#FBE5D8" stroke="#D64309" stroke-width="2.5"/>

  <text x="610" y="132" font-size="16" font-weight="700" letter-spacing="1.2" fill="#D64309">CAUSAL CONTRIBUTION</text>
  <text x="610" y="164" font-size="20" font-weight="700" fill="#3F4444">Pruned pre-index contribution</text>

  <!-- Formula -->
  <rect x="610" y="184" width="390" height="44" rx="6" fill="#ffffff" stroke="#D64309" stroke-width="1.5"/>
  <text x="805" y="212" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#D64309">cᵢ   within the Noisy-OR model</text>

  <!-- Description -->
  <text x="610" y="252" font-size="16" fill="#3F4444">
    <tspan x="610" dy="0">Per-factor activation probability fitted after</tspan>
    <tspan x="610" dy="20">temporal precedence and competing factors.</tspan>
  </text>

  <!-- Constraints -->
  <rect x="610" y="320" width="390" height="170" rx="6" fill="#ffffff" stroke="#D64309" stroke-width="1.5"/>
  <text x="624" y="344" font-size="16" font-weight="700" fill="#3F4444">Only survives if it meets:</text>
  <text x="624" y="374" font-size="16" fill="#3F4444">•  τ &lt; 0 (pre-index only)</text>
  <text x="624" y="400" font-size="16" fill="#3F4444">•  still contributes when competing</text>
  <text x="644" y="420" font-size="16" fill="#3F4444">factors are fit</text>
  <text x="624" y="446" font-size="16" fill="#3F4444">•  robust to leave-one-out pruning</text>
  <text x="624" y="472" font-size="16" fill="#3F4444">•  clinically reviewable</text>

  <!-- Example -->
  <rect x="610" y="510" width="390" height="54" rx="6" fill="#ffffff" stroke="#D64309" stroke-width="1"/>
  <text x="805" y="532" text-anchor="middle" font-size="16" font-style="italic" fill="#D64309">
    <tspan x="805" dy="0">"After pruning, hypoalbuminemia</tspan>
    <tspan x="805" dy="18">retains a non-trivial cᵢ — prioritized."</tspan>
  </text>

  <!-- Footer -->
  <text x="525" y="602" text-anchor="middle" font-size="16" font-style="italic" fill="#8A94A6">Both are pre-inferential. A confirmed causal effect requires TMLE via target-trial emulation (Stage 4).</text>
</svg>
