<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="14in" height="8in" viewBox="0 0 1680 960" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrNavyT" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#005DAA"/>
    </marker>
    <marker id="arrOrangeT" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#D64309"/>
    </marker>
    <marker id="arrGrayT" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#8a94a6"/>
    </marker>
  </defs>

  <!-- Title strip -->
  <rect x="0" y="0" width="1680" height="70" fill="#F6F8FC"/>
  <text x="40"   y="42" font-size="22" font-weight="700" fill="#0033A0" letter-spacing="0.08em">SCENARIO 2</text>
  <text x="210"  y="42" font-size="24" font-weight="700" fill="#3F4444">Drug switch &amp; adverse event</text>
  <text x="1640" y="42" text-anchor="end" font-size="14" font-style="italic" fill="#8a94a6">pharmacovigilance via therapy-journey objects</text>

  <!-- ====== LEFT PANEL: flat view ====== -->
  <g id="flatPanel">
    <text x="40" y="110" font-size="18" font-weight="700" fill="#8a94a6" letter-spacing="0.1em">FLAT · CROSS-SECTIONAL</text>
    <text x="40" y="138" font-size="15" fill="#3F4444" font-style="italic">drug exposure summarized as binary flags</text>

    <!-- Mini table -->
    <g font-size="13" fill="#3F4444">
      <rect x="40" y="160" width="620" height="32" fill="#0033A0"/>
      <text x="60"  y="180" font-weight="700" fill="#fff">patient_id</text>
      <text x="220" y="180" font-weight="700" fill="#fff">drug_A</text>
      <text x="340" y="180" font-weight="700" fill="#fff">drug_B</text>
      <text x="480" y="180" font-weight="700" fill="#fff">ADR</text>

      <rect x="40" y="192" width="620" height="26" fill="#ffffff" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="210">P-2041</text><text x="220" y="210">1</text><text x="340" y="210">1</text><text x="480" y="210">1</text>

      <rect x="40" y="218" width="620" height="26" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="236">P-2107</text><text x="220" y="236">1</text><text x="340" y="236">0</text><text x="480" y="236">0</text>

      <rect x="40" y="244" width="620" height="26" fill="#ffffff" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="262">P-2188</text><text x="220" y="262">0</text><text x="340" y="262">1</text><text x="480" y="262">1</text>

      <rect x="40" y="270" width="620" height="26" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="288">P-2256</text><text x="220" y="288">1</text><text x="340" y="288">1</text><text x="480" y="288">1</text>

      <rect x="40" y="296" width="620" height="26" fill="#ffffff" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="314">P-2331</text><text x="220" y="314">1</text><text x="340" y="314">0</text><text x="480" y="314">1</text>

      <text x="350" y="346" text-anchor="middle" font-size="22" fill="#CDCDCD">· · ·</text>
    </g>

    <!-- CPDAG panel -->
    <rect x="40" y="380" width="620" height="220" rx="10" fill="#ffffff" stroke="#CDCDCD" stroke-width="2"/>
    <text x="350" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#3F4444" letter-spacing="0.08em">THREE CANDIDATE DAGS · CPDAG</text>

    <g transform="translate(80, 440)">
      <text x="80" y="0" text-anchor="middle" font-size="11" fill="#3F4444" font-style="italic">A caused ADR, which prompted switch to B</text>
      <circle cx="10"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="10"  y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">A</text>
      <circle cx="80"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="80"  y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#0033A0">ADR</text>
      <circle cx="150" cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="150" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">B</text>
      <line x1="28"  y1="30" x2="62"  y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyT)"/>
      <line x1="98"  y1="30" x2="132" y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyT)"/>
      <text x="80"  y="76" text-anchor="middle" font-size="11" fill="#3F4444">A → ADR → B</text>
    </g>

    <g transform="translate(300, 440)">
      <text x="80" y="0" text-anchor="middle" font-size="11" fill="#3F4444" font-style="italic">B caused ADR; switch from A was prior</text>
      <circle cx="10"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="10"  y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">A</text>
      <circle cx="80"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="80"  y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#0033A0">ADR</text>
      <circle cx="150" cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="150" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">B</text>
      <line x1="62"  y1="30" x2="28"  y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyT)"/>
      <line x1="132" y1="30" x2="98"  y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyT)"/>
      <text x="80"  y="76" text-anchor="middle" font-size="11" fill="#3F4444">A ← ADR ← B</text>
    </g>

    <g transform="translate(520, 440)">
      <text x="80" y="0" text-anchor="middle" font-size="11" fill="#3F4444" font-style="italic">both drugs contribute additively</text>
      <circle cx="10"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="10"  y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">A</text>
      <circle cx="80"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="80"  y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#0033A0">ADR</text>
      <circle cx="150" cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="150" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">B</text>
      <line x1="28"  y1="30" x2="62"  y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyT)"/>
      <line x1="132" y1="30" x2="98"  y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyT)"/>
      <text x="80"  y="76" text-anchor="middle" font-size="11" fill="#3F4444">A → ADR ← B</text>
    </g>

    <text x="350" y="576" text-anchor="middle" font-size="13" fill="#8a94a6" font-style="italic">Three clinically distinct stories. The same columns cannot tell them apart.</text>

    <!-- Why it matters -->
    <rect x="40" y="620" width="620" height="90" rx="8" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="2"/>
    <text x="60"  y="650" font-size="13" font-weight="700" fill="#3F4444">Why it matters:</text>
    <text x="60"  y="674" font-size="13" fill="#3F4444">Regulators need to know which drug caused the adverse event. Cross-sectional</text>
    <text x="60"  y="694" font-size="13" fill="#3F4444">data attributes blame to whichever drug happened to be in the patient’s chart.</text>
  </g>

  <!-- Middle reshape arrow -->
  <g transform="translate(760, 380)">
    <rect x="0" y="0" width="160" height="90" rx="45" fill="#ffffff" stroke="#005DAA" stroke-width="3"/>
    <text x="80" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">therapy</text>
    <text x="80" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">journey object</text>
    <line x1="-20" y1="45" x2="0"   y2="45" stroke="#005DAA" stroke-width="5"/>
    <line x1="160" y1="45" x2="186" y2="45" stroke="#005DAA" stroke-width="5" marker-end="url(#arrNavyT)"/>
  </g>

  <!-- ====== RIGHT PANEL: longitudinal view ====== -->
  <g id="longPanel">
    <text x="960" y="110" font-size="18" font-weight="700" fill="#0033A0" letter-spacing="0.1em">LONGITUDINAL · OBJECT-CENTRIC</text>
    <text x="960" y="138" font-size="15" fill="#3F4444" font-style="italic">Patient object · dispense and ADR sub-objects with dates</text>

    <!-- Timeline -->
    <rect x="960" y="160" width="680" height="210" rx="10" fill="#ffffff" stroke="#CDCDCD" stroke-width="2"/>
    <text x="980" y="188" font-size="13" font-weight="700" fill="#3F4444" letter-spacing="0.06em">PATIENT P-2041 · PRESCRIPTION &amp; ADR TIMELINE</text>

    <!-- Axis -->
    <line x1="990" y1="280" x2="1620" y2="280" stroke="#CDCDCD" stroke-width="2"/>
    <text x="1050" y="348" font-size="12" fill="#8a94a6" font-style="italic">drug A start</text>
    <text x="1050" y="362" font-size="12" fill="#8a94a6" font-style="italic">day 0</text>
    <text x="1280" y="348" font-size="12" fill="#8a94a6" font-style="italic">ADR onset</text>
    <text x="1280" y="362" font-size="12" fill="#8a94a6" font-style="italic">day 120</text>
    <text x="1460" y="348" font-size="12" fill="#8a94a6" font-style="italic">switch · drug B</text>
    <text x="1460" y="362" font-size="12" fill="#8a94a6" font-style="italic">day 140</text>

    <!-- A dispense run (blue bar from day 0 to day 120) -->
    <rect x="1060" y="272" width="230" height="16" rx="4" fill="#0033A0"/>
    <text x="1175" y="312" text-anchor="middle" font-size="11" font-style="italic" fill="#0033A0">drug A (days 0–120)</text>

    <!-- ADR marker -->
    <polygon points="1290,252 1310,252 1300,272" fill="#D64309"/>
    <text x="1300" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#D64309">ADR</text>

    <!-- B dispense run -->
    <rect x="1470" y="272" width="140" height="16" rx="4" fill="#005DAA" fill-opacity="0.75"/>
    <text x="1540" y="312" text-anchor="middle" font-size="11" font-style="italic" fill="#005DAA">drug B (day 140+)</text>

    <!-- Oriented DAG -->
    <rect x="960" y="400" width="680" height="180" rx="10" fill="#ffffff" stroke="#005DAA" stroke-width="2"/>
    <text x="1300" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0" letter-spacing="0.08em">SINGLE ORIENTED DAG</text>

    <g transform="translate(1050, 470)">
      <circle cx="30"  cy="55" r="28" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
      <text x="30"  y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">A</text>
      <text x="30"  y="68" text-anchor="middle" font-size="9" fill="#3F4444">days 0–120</text>
      <circle cx="270" cy="55" r="28" fill="#D64309" stroke="#D64309" stroke-width="3"/>
      <text x="270" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ADR</text>
      <text x="270" y="68" text-anchor="middle" font-size="9" fill="#ffffff">day 120</text>
      <circle cx="510" cy="55" r="28" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
      <text x="510" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">B</text>
      <text x="510" y="68" text-anchor="middle" font-size="9" fill="#3F4444">day 140+</text>
      <line x1="58"  y1="55" x2="240" y2="55" stroke="#D64309" stroke-width="4" marker-end="url(#arrOrangeT)"/>
      <line x1="298" y1="55" x2="480" y2="55" stroke="#005DAA" stroke-width="3" marker-end="url(#arrNavyT)"/>
      <text x="149" y="105" text-anchor="middle" font-size="11" fill="#D64309" font-style="italic">candidate ADR attribution</text>
      <text x="389" y="105" text-anchor="middle" font-size="11" fill="#8a94a6" font-style="italic">ADR prompts switch · not reverse</text>
    </g>

    <!-- What resolves -->
    <rect x="960" y="620" width="680" height="90" rx="8" fill="#FFF4E6" stroke="#D64309" stroke-width="2"/>
    <text x="980"  y="650" font-size="13" font-weight="700" fill="#D64309">What temporal precedence resolves:</text>
    <text x="980"  y="674" font-size="13" fill="#3F4444">Drug B dispense is <tspan font-weight="700">after</tspan> the ADR. The collider/additive stories are ruled out;</text>
    <text x="980"  y="694" font-size="13" fill="#3F4444">the ADR-on-A hypothesis becomes the only CPDAG-compatible orientation.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 770)">
    <rect x="0" y="0" width="1600" height="150" rx="10" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="1"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#0033A0" letter-spacing="0.08em">WHAT THE OBJECT MODEL CARRIES THAT THE FLAT TABLE DOES NOT</text>

    <g transform="translate(20, 54)">
      <rect x="0" y="0" width="24" height="14" fill="#0033A0"/>
      <text x="36" y="12" font-size="12" fill="#3F4444"><tspan font-weight="700">Dispense runs</tspan> — start/stop dates of drug A and drug B, not a single “ever-exposed” flag.</text>
    </g>
    <g transform="translate(20, 78)">
      <rect x="0" y="0" width="24" height="14" fill="#D64309"/>
      <text x="36" y="12" font-size="12" fill="#3F4444"><tspan font-weight="700">ADR onset date</tspan> — the timestamp rules out drug B (not yet started) and pins blame on A.</text>
    </g>
    <g transform="translate(20, 102)">
      <rect x="0" y="0" width="24" height="14" fill="#ffffff" stroke="#0033A0" stroke-width="2"/>
      <text x="36" y="12" font-size="12" fill="#3F4444"><tspan font-weight="700">Switch event</tspan> — transition from A to B carried as a distinct relational sub-object on the patient.</text>
    </g>
    <text x="1580" y="128" text-anchor="end" font-size="11" font-style="italic" fill="#8a94a6">Xplain Data therapy-journey module · illustrative</text>
  </g>
</svg>
