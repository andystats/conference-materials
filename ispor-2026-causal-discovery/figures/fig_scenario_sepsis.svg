<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="14in" height="8in" viewBox="0 0 1680 960" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrNavyS" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#005DAA"/>
    </marker>
    <marker id="arrOrangeS" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#D64309"/>
    </marker>
    <marker id="arrGrayS" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#8a94a6"/>
    </marker>
  </defs>

  <!-- ====== Title strip ====== -->
  <rect x="0" y="0" width="1680" height="70" fill="#F6F8FC"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0033A0" letter-spacing="0.08em">SCENARIO 1</text>
  <text x="210" y="42" font-size="24" font-weight="700" fill="#3F4444">Sepsis → antibiotic → mortality</text>
  <text x="1640" y="42" text-anchor="end" font-size="14" font-style="italic" fill="#8a94a6">the 3-hour bundle question</text>

  <!-- ====== LEFT PANEL: flat view ====== -->
  <g id="flatPanel">
    <text x="40" y="110" font-size="18" font-weight="700" fill="#8a94a6" letter-spacing="0.1em">FLAT · CROSS-SECTIONAL</text>
    <text x="40" y="138" font-size="15" fill="#3F4444" font-style="italic">one row per admission · no times</text>

    <!-- Mini table -->
    <g font-size="13" fill="#3F4444">
      <rect x="40" y="160" width="620" height="32" fill="#0033A0"/>
      <text x="60"  y="180" font-weight="700" fill="#fff">admission_id</text>
      <text x="220" y="180" font-weight="700" fill="#fff">sepsis</text>
      <text x="330" y="180" font-weight="700" fill="#fff">broad_abx</text>
      <text x="470" y="180" font-weight="700" fill="#fff">mortality</text>

      <rect x="40" y="192" width="620" height="26" fill="#ffffff" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="210">10012</text><text x="220" y="210">1</text><text x="330" y="210">1</text><text x="470" y="210">1</text>

      <rect x="40" y="218" width="620" height="26" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="236">10338</text><text x="220" y="236">1</text><text x="330" y="236">1</text><text x="470" y="236">0</text>

      <rect x="40" y="244" width="620" height="26" fill="#ffffff" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="262">10551</text><text x="220" y="262">0</text><text x="330" y="262">0</text><text x="470" y="262">0</text>

      <rect x="40" y="270" width="620" height="26" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="288">10709</text><text x="220" y="288">1</text><text x="330" y="288">0</text><text x="470" y="288">1</text>

      <rect x="40" y="296" width="620" height="26" fill="#ffffff" stroke="#CDCDCD" stroke-width="1"/>
      <text x="60"  y="314">10863</text><text x="220" y="314">1</text><text x="330" y="314">1</text><text x="470" y="314">0</text>

      <text x="350" y="346" text-anchor="middle" font-size="22" fill="#CDCDCD">· · ·</text>
    </g>

    <!-- CPDAG panel -->
    <rect x="40" y="380" width="620" height="220" rx="10" fill="#ffffff" stroke="#CDCDCD" stroke-width="2"/>
    <text x="350" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#3F4444" letter-spacing="0.08em">CPDAG RETURNED · 3 CANDIDATE DAGS</text>

    <!-- Candidate DAG 1: S → A → M (mediation) -->
    <g transform="translate(80, 440)">
      <text x="80" y="0" text-anchor="middle" font-size="11" fill="#3F4444" font-style="italic">mediation</text>
      <circle cx="10"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="10"  y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">S</text>
      <circle cx="80"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="80"  y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">A</text>
      <circle cx="150" cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="150" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">M</text>
      <line x1="28"  y1="30" x2="62"  y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyS)"/>
      <line x1="98"  y1="30" x2="132" y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyS)"/>
      <text x="80"  y="76" text-anchor="middle" font-size="11" fill="#3F4444">S → A → M</text>
    </g>

    <!-- Candidate DAG 2: S → A ← M (collider: sicker get antibiotics) -->
    <g transform="translate(300, 440)">
      <text x="80" y="0" text-anchor="middle" font-size="11" fill="#3F4444" font-style="italic">collider</text>
      <circle cx="10"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="10"  y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">S</text>
      <circle cx="80"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="80"  y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">A</text>
      <circle cx="150" cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="150" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">M</text>
      <line x1="28"  y1="30" x2="62"  y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyS)"/>
      <line x1="132" y1="30" x2="98"  y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyS)"/>
      <text x="80"  y="76" text-anchor="middle" font-size="11" fill="#3F4444">S → A ← M</text>
    </g>

    <!-- Candidate DAG 3: S ← A → M (antibiotic explains both — absurd clinically but not ruled out by the CPDAG) -->
    <g transform="translate(520, 440)">
      <text x="80" y="0" text-anchor="middle" font-size="11" fill="#3F4444" font-style="italic">shared cause</text>
      <circle cx="10"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="10"  y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">S</text>
      <circle cx="80"  cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="80"  y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">A</text>
      <circle cx="150" cy="30" r="18" fill="#ffffff" stroke="#0033A0" stroke-width="2.2"/>
      <text x="150" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">M</text>
      <line x1="62"  y1="30" x2="28"  y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyS)"/>
      <line x1="98"  y1="30" x2="132" y2="30" stroke="#005DAA" stroke-width="2" marker-end="url(#arrNavyS)"/>
      <text x="80"  y="76" text-anchor="middle" font-size="11" fill="#3F4444">S ← A → M</text>
    </g>

    <text x="350" y="576" text-anchor="middle" font-size="13" fill="#8a94a6" font-style="italic">All three fit the same conditional-independence pattern.</text>

    <!-- "Why this matters" box -->
    <rect x="40" y="620" width="620" height="90" rx="8" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="2"/>
    <text x="60"  y="650" font-size="13" font-weight="700" fill="#3F4444">Why it matters:</text>
    <text x="60"  y="674" font-size="13" fill="#3F4444">The sepsis bundle question is whether early antibiotics are a</text>
    <text x="60"  y="694" font-size="13" fill="#3F4444">mediator (protective treatment) or a marker of severity. Flat tables can’t tell.</text>
  </g>

  <!-- ====== MIDDLE: reshape arrow ====== -->
  <g transform="translate(760, 380)">
    <rect x="0" y="0" width="160" height="90" rx="45" fill="#ffffff" stroke="#005DAA" stroke-width="3"/>
    <text x="80" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">object +</text>
    <text x="80" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">timestamps</text>
    <line x1="-20" y1="45" x2="0"   y2="45" stroke="#005DAA" stroke-width="5"/>
    <line x1="160" y1="45" x2="186" y2="45" stroke="#005DAA" stroke-width="5" marker-end="url(#arrNavyS)"/>
  </g>

  <!-- ====== RIGHT PANEL: longitudinal view ====== -->
  <g id="longPanel">
    <text x="960" y="110" font-size="18" font-weight="700" fill="#0033A0" letter-spacing="0.1em">LONGITUDINAL · OBJECT-CENTRIC</text>
    <text x="960" y="138" font-size="15" fill="#3F4444" font-style="italic">Admission object · events with timestamps</text>

    <!-- Timeline for one patient -->
    <rect x="960" y="160" width="680" height="210" rx="10" fill="#ffffff" stroke="#CDCDCD" stroke-width="2"/>
    <text x="980"  y="188" font-size="13" font-weight="700" fill="#3F4444" letter-spacing="0.06em">ADMISSION 10012 · EVENT TIMELINE</text>

    <!-- Timeline axis -->
    <line x1="990" y1="280" x2="1620" y2="280" stroke="#CDCDCD" stroke-width="2"/>
    <text x="990"  y="348" font-size="12" fill="#8a94a6" font-style="italic">ED arrival</text>
    <text x="990"  y="362" font-size="12" fill="#8a94a6" font-style="italic">t = 0h</text>
    <text x="1200" y="348" font-size="12" fill="#8a94a6" font-style="italic">sepsis dx</text>
    <text x="1200" y="362" font-size="12" fill="#8a94a6" font-style="italic">t = 1h</text>
    <text x="1380" y="348" font-size="12" fill="#8a94a6" font-style="italic">broad-abx</text>
    <text x="1380" y="362" font-size="12" fill="#8a94a6" font-style="italic">t = 3h</text>
    <text x="1610" y="348" text-anchor="end" font-size="12" fill="#8a94a6" font-style="italic">outcome</text>
    <text x="1610" y="362" text-anchor="end" font-size="12" fill="#8a94a6" font-style="italic">t = 72h</text>

    <!-- Event markers -->
    <circle cx="1000" cy="280" r="11" fill="#0033A0"/>
    <text x="1000" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">ED</text>
    <circle cx="1210" cy="280" r="13" fill="#0033A0"/>
    <text x="1210" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">S</text>
    <text x="1210" y="236" text-anchor="middle" font-size="10" fill="#3F4444">sepsis</text>
    <circle cx="1390" cy="280" r="13" fill="#D64309"/>
    <text x="1390" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#D64309">A</text>
    <text x="1390" y="236" text-anchor="middle" font-size="10" fill="#D64309">abx order</text>
    <circle cx="1600" cy="280" r="13" fill="#0033A0"/>
    <text x="1600" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#0033A0">M</text>
    <text x="1600" y="236" text-anchor="middle" font-size="10" fill="#3F4444">mortality</text>

    <!-- Oriented DAG below -->
    <rect x="960" y="400" width="680" height="180" rx="10" fill="#ffffff" stroke="#005DAA" stroke-width="2"/>
    <text x="1300" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0" letter-spacing="0.08em">SINGLE ORIENTED DAG</text>

    <g transform="translate(1050, 470)">
      <circle cx="30"  cy="55" r="28" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
      <text x="30"  y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">S</text>
      <text x="30"  y="68" text-anchor="middle" font-size="9" fill="#3F4444">sepsis</text>
      <circle cx="270" cy="55" r="28" fill="#D64309" stroke="#D64309" stroke-width="3"/>
      <text x="270" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">A</text>
      <text x="270" y="68" text-anchor="middle" font-size="9" fill="#ffffff">abx</text>
      <circle cx="510" cy="55" r="28" fill="#ffffff" stroke="#0033A0" stroke-width="4"/>
      <circle cx="510" cy="55" r="22" fill="#ffffff" stroke="#0033A0" stroke-width="1.5"/>
      <text x="510" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0">M</text>
      <text x="510" y="68" text-anchor="middle" font-size="9" fill="#3F4444">outcome</text>
      <line x1="58"  y1="55" x2="240" y2="55" stroke="#005DAA" stroke-width="3" marker-end="url(#arrNavyS)"/>
      <line x1="298" y1="55" x2="480" y2="55" stroke="#D64309" stroke-width="4" marker-end="url(#arrOrangeS)"/>
      <text x="149" y="105" text-anchor="middle" font-size="11" fill="#8a94a6" font-style="italic">t(S) &lt; t(A)</text>
      <text x="389" y="105" text-anchor="middle" font-size="11" fill="#D64309" font-style="italic">candidate effect · time-to-abx</text>
    </g>

    <!-- "What resolves" box -->
    <rect x="960" y="620" width="680" height="90" rx="8" fill="#FFF4E6" stroke="#D64309" stroke-width="2"/>
    <text x="980"  y="650" font-size="13" font-weight="700" fill="#D64309">What temporal precedence resolves:</text>
    <text x="980"  y="674" font-size="13" fill="#3F4444">Sepsis dx precedes abx order precedes outcome — the only ordering compatible</text>
    <text x="980"  y="694" font-size="13" fill="#3F4444">with observed event times. “Time-to-antibiotic” becomes the identifiable estimand.</text>
  </g>

  <!-- ====== Bottom legend ====== -->
  <g transform="translate(40, 770)">
    <rect x="0" y="0" width="1600" height="150" rx="10" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="1"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#0033A0" letter-spacing="0.08em">WHAT THE OBJECT MODEL CARRIES THAT THE FLAT TABLE DOES NOT</text>

    <g transform="translate(20, 54)">
      <rect x="0" y="0" width="24" height="14" fill="#0033A0"/>
      <text x="36" y="12" font-size="12" fill="#3F4444"><tspan font-weight="700">Event timestamps</tspan> — sepsis diagnosis at t=1h vs. antibiotic at t=3h — fix the chain direction.</text>
    </g>
    <g transform="translate(20, 78)">
      <rect x="0" y="0" width="24" height="14" fill="#D64309"/>
      <text x="36" y="12" font-size="12" fill="#3F4444"><tspan font-weight="700">Candidate intervention node</tspan> — antibiotic as a timed action, not a static indicator.</text>
    </g>
    <g transform="translate(20, 102)">
      <rect x="0" y="0" width="24" height="14" fill="#ffffff" stroke="#0033A0" stroke-width="2"/>
      <text x="36" y="12" font-size="12" fill="#3F4444"><tspan font-weight="700">Outcome with follow-up window</tspan> — mortality anchored to an admission object, not a column.</text>
    </g>
    <text x="1580" y="128" text-anchor="end" font-size="11" font-style="italic" fill="#8a94a6">MIMIC-IV v3.1 · schematic · ISPOR 2026 MSR72</text>
  </g>
</svg>
