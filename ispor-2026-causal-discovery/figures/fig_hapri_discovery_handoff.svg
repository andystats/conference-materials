<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10.5in" height="6.0in" viewBox="0 0 1050 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrDark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#555555"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#D64309"/>
    </marker>
    <marker id="arrNavy" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#0033A0"/>
    </marker>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1.5" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title + kicker -->
  <text x="525" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#333333">Hypoalbuminemia surfaced upstream — candidate, not confirmed</text>
  <text x="525" y="62" text-anchor="middle" font-size="16" font-style="italic" fill="#999999">Rediscovered risks sit where clinicians expect; the orange edge is the new hypothesis worth testing.</text>

  <!-- =============== TOP: discovered graph =============== -->

  <!-- Critical illness (root, navy) -->
  <g filter="url(#dropShadow)">
    <circle cx="80" cy="280" r="42" fill="#0033A0" stroke="#00267A" stroke-width="2"/>
  </g>
  <text x="80" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Critical</text>
  <text x="80" y="294" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">illness</text>

  <!-- Rediscovered risks in blue (ICU mechanics) -->
  <g filter="url(#dropShadow)">
    <circle cx="290" cy="140" r="32" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>
    <circle cx="290" cy="220" r="32" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>
    <circle cx="290" cy="300" r="32" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>
    <circle cx="290" cy="380" r="32" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>
    <circle cx="290" cy="460" r="32" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>
  </g>
  <text x="290" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Mech.</text>
  <text x="290" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">vent.</text>
  <text x="290" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Hemo-</text>
  <text x="290" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">dynamic</text>
  <text x="290" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Immobile</text>
  <text x="290" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Moisture</text>
  <text x="290" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Yeast</text>

  <!-- Critical illness -> each risk factor (thin navy arrows) -->
  <line x1="118" y1="263" x2="260" y2="152" stroke="#0033A0" stroke-width="2" opacity="0.7" marker-end="url(#arrNavy)"/>
  <line x1="120" y1="270" x2="260" y2="222" stroke="#0033A0" stroke-width="2" opacity="0.7" marker-end="url(#arrNavy)"/>
  <line x1="122" y1="280" x2="260" y2="295" stroke="#0033A0" stroke-width="2" opacity="0.7" marker-end="url(#arrNavy)"/>
  <line x1="120" y1="293" x2="260" y2="370" stroke="#0033A0" stroke-width="2" opacity="0.7" marker-end="url(#arrNavy)"/>
  <line x1="117" y1="300" x2="260" y2="447" stroke="#0033A0" stroke-width="2" opacity="0.7" marker-end="url(#arrNavy)"/>

  <!-- Rediscovered label -->
  <g>
    <rect x="200" y="90" width="180" height="24" rx="12" fill="#E7F1F8" stroke="#4A90D9" stroke-width="1.5"/>
    <text x="290" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#3A7BC8">rediscovered risks</text>
  </g>

  <!-- Hypoalbuminemia (orange hero, larger) -->
  <g filter="url(#dropShadow)">
    <circle cx="530" cy="280" r="52" fill="#D64309" stroke="#A83207" stroke-width="3"/>
  </g>
  <text x="530" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Hypo-</text>
  <text x="530" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">albuminemia</text>
  <text x="530" y="355" text-anchor="middle" font-size="16" font-weight="700" fill="#D64309">candidate upstream</text>

  <!-- Arrows from blue risks to orange (converging mid) -->
  <line x1="320" y1="152" x2="484" y2="252" stroke="#555555" stroke-width="2" opacity="0.55" marker-end="url(#arrDark)"/>
  <line x1="322" y1="222" x2="482" y2="266" stroke="#555555" stroke-width="2" opacity="0.55" marker-end="url(#arrDark)"/>
  <line x1="322" y1="300" x2="480" y2="290" stroke="#555555" stroke-width="2" opacity="0.55" marker-end="url(#arrDark)"/>
  <line x1="320" y1="370" x2="484" y2="310" stroke="#555555" stroke-width="2" opacity="0.55" marker-end="url(#arrDark)"/>
  <line x1="318" y1="448" x2="484" y2="320" stroke="#555555" stroke-width="2" opacity="0.55" marker-end="url(#arrDark)"/>

  <!-- HAPrI outcome (double-ring navy, outcome) -->
  <g filter="url(#dropShadow)">
    <circle cx="820" cy="280" r="50" fill="#FFFFFF" stroke="#0033A0" stroke-width="4"/>
    <circle cx="820" cy="280" r="40" fill="#FFFFFF" stroke="#0033A0" stroke-width="2"/>
  </g>
  <text x="820" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#0033A0">HAPrI</text>
  <text x="820" y="294" text-anchor="middle" font-size="16" fill="#666666">outcome</text>

  <!-- Candidate upstream edge (thick orange) -->
  <line x1="582" y1="280" x2="768" y2="280" stroke="#D64309" stroke-width="5" marker-end="url(#arrOrange)"/>
  <text x="675" y="265" text-anchor="middle" font-size="16" font-weight="700" font-style="italic" fill="#D64309">candidate upstream edge</text>

  <!-- Rediscovered risks → HAPrI (thin) -->
  <path d="M 322 152 Q 600 80 785 250" fill="none" stroke="#0033A0" stroke-width="1.5" opacity="0.45" marker-end="url(#arrNavy)"/>
  <path d="M 322 460 Q 600 540 790 320" fill="none" stroke="#0033A0" stroke-width="1.5" opacity="0.45" marker-end="url(#arrNavy)"/>

  <!-- Divider -->
  <line x1="60" y1="500" x2="990" y2="500" stroke="#CCCCCC" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- =============== BOTTOM: handoff pipeline =============== -->
  <text x="525" y="524" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.5" fill="#666666">DISCOVERY → CONFIRMATORY INFERENCE</text>

  <!-- Four pills in a row -->
  <g filter="url(#dropShadow)">
    <rect x="50"  y="548" width="190" height="40" rx="20" fill="#4A90D9"/>
  </g>
  <text x="145" y="573" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1. discovered edge</text>

  <g filter="url(#dropShadow)">
    <rect x="280" y="548" width="190" height="40" rx="20" fill="#783C96"/>
  </g>
  <text x="375" y="573" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2. clinician review</text>

  <g filter="url(#dropShadow)">
    <rect x="510" y="548" width="190" height="40" rx="20" fill="#E8A838"/>
  </g>
  <text x="605" y="573" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3. target trial</text>

  <g filter="url(#dropShadow)">
    <rect x="740" y="548" width="190" height="40" rx="20" fill="#D64309"/>
  </g>
  <text x="835" y="573" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4. TMLE / g-methods</text>

  <!-- Pipeline arrows between pills -->
  <line x1="244" y1="568" x2="276" y2="568" stroke="#555555" stroke-width="2.5" marker-end="url(#arrDark)"/>
  <line x1="474" y1="568" x2="506" y2="568" stroke="#555555" stroke-width="2.5" marker-end="url(#arrDark)"/>
  <line x1="704" y1="568" x2="736" y2="568" stroke="#555555" stroke-width="2.5" marker-end="url(#arrDark)"/>
</svg>
