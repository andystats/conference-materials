<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10.5in" height="5.0in" viewBox="0 0 1050 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrDark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#555555"/>
    </marker>
    <marker id="arrNavy" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#0033A0"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#D64309"/>
    </marker>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1.5" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title + kicker -->
  <text x="525" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#333333">Keep the clocks attached — time orients the arrows</text>
  <text x="525" y="62" text-anchor="middle" font-size="16" font-style="italic" fill="#999999">A patient object stamps every event with its clock, so the algorithm cannot orient edges backwards in time.</text>

  <!-- =============== LEFT PANEL: patient object =============== -->
  <text x="200" y="110" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.2" fill="#4682B4">PATIENT OBJECT</text>

  <!-- Root node: Patient -->
  <g filter="url(#dropShadow)">
    <circle cx="80" cy="250" r="38" fill="#0033A0" stroke="#00267A" stroke-width="2"/>
  </g>
  <text x="80" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Patient</text>
  <text x="80" y="263" text-anchor="middle" font-size="16" fill="#FFFFFF">root</text>

  <!-- Child events at dated times (along a vertical line) -->
  <g filter="url(#dropShadow)">
    <circle cx="240" cy="160" r="30" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>
  </g>
  <text x="240" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Labs</text>
  <text x="292" y="145" font-size="16" fill="#666666">albumin · day −3</text>

  <g filter="url(#dropShadow)">
    <circle cx="240" cy="250" r="30" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>
  </g>
  <text x="240" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Meds</text>
  <text x="292" y="245" font-size="16" fill="#666666">pressors · day −2</text>

  <g filter="url(#dropShadow)">
    <circle cx="240" cy="340" r="30" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>
  </g>
  <text x="240" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Proc.</text>
  <text x="292" y="335" font-size="16" fill="#666666">intubation · day −1</text>

  <g filter="url(#dropShadow)">
    <circle cx="240" cy="420" r="30" fill="#D64309" stroke="#A83207" stroke-width="2"/>
  </g>
  <text x="240" y="425" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">HAPrI</text>
  <text x="292" y="420" font-size="16" font-weight="700" fill="#D64309">day 0 (index)</text>

  <!-- Tree edges Patient -> events -->
  <line x1="115" y1="235" x2="213" y2="170" stroke="#0033A0" stroke-width="2.5" marker-end="url(#arrNavy)"/>
  <line x1="118" y1="250" x2="210" y2="250" stroke="#0033A0" stroke-width="2.5" marker-end="url(#arrNavy)"/>
  <line x1="115" y1="265" x2="213" y2="328" stroke="#0033A0" stroke-width="2.5" marker-end="url(#arrNavy)"/>
  <line x1="112" y1="275" x2="213" y2="405" stroke="#0033A0" stroke-width="2.5" marker-end="url(#arrNavy)"/>

  <!-- =============== MIDDLE: time axis =============== -->
  <text x="525" y="110" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.2" fill="#5B8A5E">ADD THE CLOCK</text>

  <!-- Clock glyph -->
  <g filter="url(#dropShadow)">
    <circle cx="525" cy="200" r="45" fill="#FFFFFF" stroke="#5B8A5E" stroke-width="3"/>
  </g>
  <line x1="525" y1="200" x2="525" y2="168" stroke="#5B8A5E" stroke-width="3" stroke-linecap="round"/>
  <line x1="525" y1="200" x2="548" y2="210" stroke="#5B8A5E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="525" cy="200" r="3" fill="#5B8A5E"/>
  <text x="525" y="272" text-anchor="middle" font-size="16" fill="#333333">event timestamps</text>

  <!-- Vertical time axis τ -->
  <line x1="425" y1="320" x2="625" y2="320" stroke="#333333" stroke-width="2.5" marker-end="url(#arrDark)"/>
  <text x="425" y="340" text-anchor="middle" font-size="16" fill="#4682B4" font-weight="700">τ &lt; 0</text>
  <text x="525" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#D64309">0</text>
  <text x="610" y="340" text-anchor="middle" font-size="16" fill="#999999" font-weight="700">τ &gt; 0</text>
  <text x="525" y="362" text-anchor="middle" font-size="16" font-style="italic" fill="#666666">only τ &lt; 0 enters discovery</text>

  <!-- Plus sign between clock and τ -->
  <text x="525" y="418" text-anchor="middle" font-size="22" font-weight="700" fill="#5B8A5E">⊕</text>
  <text x="525" y="442" text-anchor="middle" font-size="16" fill="#5B8A5E" font-weight="700">relational structure</text>

  <!-- Big rightward arrow -->
  <line x1="685" y1="250" x2="735" y2="250" stroke="#5B8A5E" stroke-width="6" marker-end="url(#arrDark)"/>

  <!-- =============== RIGHT PANEL: oriented DAG =============== -->
  <text x="880" y="110" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="1.2" fill="#D64309">ORIENTED DAG</text>

  <!-- Same X, Y, Z but now oriented by time -->
  <g filter="url(#dropShadow)">
    <circle cx="800" cy="200" r="30" fill="#4A90D9" stroke="#3A7BC8" stroke-width="2"/>
    <circle cx="880" cy="280" r="30" fill="#D4645C" stroke="#B84E47" stroke-width="2"/>
    <circle cx="960" cy="200" r="30" fill="#E8A838" stroke="#CC8F2E" stroke-width="2"/>
  </g>
  <text x="800" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">X</text>
  <text x="880" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Y</text>
  <text x="960" y="206" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Z</text>
  <text x="800" y="165" text-anchor="middle" font-size="16" fill="#666666">day −3</text>
  <text x="880" y="335" text-anchor="middle" font-size="16" fill="#666666">day −1</text>
  <text x="960" y="165" text-anchor="middle" font-size="16" fill="#666666">day 0</text>
  <!-- arrows X→Y→Z, now directed -->
  <line x1="820" y1="225" x2="862" y2="258" stroke="#333333" stroke-width="3" marker-end="url(#arrDark)"/>
  <line x1="898" y1="258" x2="940" y2="225" stroke="#333333" stroke-width="3" marker-end="url(#arrDark)"/>

  <text x="880" y="390" text-anchor="middle" font-size="16" font-style="italic" fill="#5B8A5E">time picks the story</text>

  <!-- Footer takeaway -->
  <text x="525" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#333333">Timestamps are not features — they are hard orientation constraints.</text>
</svg>
