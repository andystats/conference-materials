<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10in" height="10in" viewBox="0 0 1000 1000" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrNavy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#005DAA"/>
    </marker>
    <marker id="arrOrange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#D64309"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#CDCDCD"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#0033A0">Discovered causal structure (schematic)</text>
  <text x="500" y="70" text-anchor="middle" font-size="16" fill="#3F4444" font-style="italic">HAPrI drivers surfaced by object-centric search · time flows left to right</text>

  <!-- Time axis -->
  <line x1="60" y1="920" x2="940" y2="920" stroke="#CDCDCD" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="60" y="946" font-size="14" fill="#3F4444" font-style="italic">earlier</text>
  <text x="940" y="946" text-anchor="end" font-size="14" fill="#3F4444" font-style="italic">later (outcome)</text>
  <text x="500" y="946" text-anchor="middle" font-size="14" fill="#3F4444" font-style="italic">temporal precedence</text>

  <!-- ==== Level 0: ICU context ==== -->
  <g id="icuNode">
    <rect x="50" y="430" width="180" height="80" rx="14" fill="#0033A0" stroke="#0033A0" stroke-width="3"/>
    <text x="140" y="470" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Critical illness</text>
    <text x="140" y="494" text-anchor="middle" font-size="15" fill="#ffffff" opacity="0.85">ICU admission, sepsis</text>
  </g>

  <!-- ==== Level 1: observed risk factors ==== -->
  <g id="ventNode">
    <rect x="310" y="120" width="200" height="70" rx="14" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
    <text x="410" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Mechanical ventilation</text>
    <text x="410" y="178" text-anchor="middle" font-size="13" fill="#3F4444" font-style="italic">rediscovered</text>
  </g>
  <g id="hemoNode">
    <rect x="310" y="265" width="200" height="70" rx="14" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
    <text x="410" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Hemodynamic</text>
    <text x="410" y="316" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">instability</text>
  </g>
  <g id="immNode">
    <rect x="310" y="410" width="200" height="70" rx="14" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
    <text x="410" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Immobility</text>
    <text x="410" y="468" text-anchor="middle" font-size="13" fill="#3F4444" font-style="italic">rediscovered</text>
  </g>
  <g id="moistNode">
    <rect x="310" y="555" width="200" height="70" rx="14" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
    <text x="410" y="590" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0">Moisture exposure</text>
    <text x="410" y="613" text-anchor="middle" font-size="13" fill="#3F4444" font-style="italic">rediscovered</text>
  </g>

  <!-- Level 1 albumin-pathway nodes -->
  <g id="albAdmNode">
    <rect x="310" y="720" width="220" height="70" rx="14" fill="#FFF1EA" stroke="#D64309" stroke-width="3"/>
    <text x="420" y="750" text-anchor="middle" font-size="17" font-weight="700" fill="#D64309">Albumin administration</text>
    <text x="420" y="773" text-anchor="middle" font-size="13" fill="#D64309" font-style="italic">timing flagged</text>
  </g>
  <g id="fluidNode">
    <rect x="310" y="820" width="220" height="70" rx="14" fill="#FFF1EA" stroke="#D64309" stroke-width="3"/>
    <text x="420" y="850" text-anchor="middle" font-size="17" font-weight="700" fill="#D64309">Fluid management</text>
    <text x="420" y="873" text-anchor="middle" font-size="13" fill="#D64309" font-style="italic">patterns flagged</text>
  </g>

  <!-- ==== Level 2: hypoalbuminemia (orange hero) ==== -->
  <g id="hypoNode">
    <!-- drop shadow ring to emphasize -->
    <rect x="540" y="486" width="260" height="108" rx="18" fill="#FFE0CF" opacity="0.9"/>
    <rect x="550" y="496" width="240" height="88" rx="14" fill="#D64309" stroke="#D64309" stroke-width="5"/>
    <text x="670" y="534" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Hypoalbuminemia</text>
    <text x="670" y="562" text-anchor="middle" font-size="13" fill="#ffffff" opacity="0.95">candidate upstream driver</text>
    <text x="670" y="580" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.85" font-style="italic">pending confirmatory TMLE</text>
  </g>

  <!-- ==== Level 3: HAPrI (outcome, navy double-ring) ==== -->
  <g id="outNode">
    <circle cx="910" cy="540" r="72" fill="#ffffff" stroke="#0033A0" stroke-width="5"/>
    <circle cx="910" cy="540" r="58" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
    <text x="910" y="536" text-anchor="middle" font-size="22" font-weight="700" fill="#0033A0">HAPrI</text>
    <text x="910" y="560" text-anchor="middle" font-size="12" fill="#3F4444">outcome</text>
    <text x="910" y="576" text-anchor="middle" font-size="11" fill="#3F4444" font-style="italic">stage ≥ 2</text>
  </g>

  <!-- ==== Edges ==== -->
  <!-- ICU -> all risk factors (thin, navy) -->
  <g stroke="#005DAA" stroke-width="2.5" fill="none" opacity="0.75">
    <line x1="230" y1="450" x2="310" y2="165" marker-end="url(#arrNavy)"/>
    <line x1="230" y1="460" x2="310" y2="295" marker-end="url(#arrNavy)"/>
    <line x1="230" y1="470" x2="310" y2="445" marker-end="url(#arrNavy)"/>
    <line x1="230" y1="480" x2="310" y2="590" marker-end="url(#arrNavy)"/>
    <line x1="230" y1="490" x2="310" y2="745" marker-end="url(#arrNavy)"/>
    <line x1="230" y1="500" x2="310" y2="855" marker-end="url(#arrNavy)"/>
  </g>

  <!-- Albumin / fluid -> hypoalbuminemia (orange) -->
  <g stroke="#D64309" stroke-width="3.2" fill="none">
    <path d="M 530 755 C 560 700, 575 620, 568 560" marker-end="url(#arrOrange)"/>
    <path d="M 530 855 C 575 780, 575 650, 568 570" marker-end="url(#arrOrange)"/>
  </g>

  <!-- Hemodynamic instability -> hypoalbuminemia (confounder-like, navy dashed) -->
  <g stroke="#005DAA" stroke-width="2.5" fill="none" opacity="0.6" stroke-dasharray="10 6">
    <path d="M 510 300 C 545 340, 560 440, 568 510" marker-end="url(#arrNavy)"/>
  </g>

  <!-- Level 1 nodes -> HAPrI (navy) - routed below hypoalbuminemia node -->
  <g stroke="#005DAA" stroke-width="2.5" fill="none" opacity="0.75">
    <path d="M 510 155 C 720 170, 840 320, 870 485" marker-end="url(#arrNavy)"/>
    <path d="M 510 300 C 600 340, 820 390, 855 482" marker-end="url(#arrNavy)"/>
    <path d="M 510 445 C 600 620, 780 680, 855 598" marker-end="url(#arrNavy)"/>
    <path d="M 510 590 C 620 640, 780 670, 855 600" marker-end="url(#arrNavy)"/>
  </g>

  <!-- Hypoalbuminemia -> HAPrI (THICK ORANGE headline edge) -->
  <g>
    <line x1="800" y1="540" x2="838" y2="540" stroke="#D64309" stroke-width="9" marker-end="url(#arrOrange)"/>
    <text x="820" y="620" text-anchor="middle" font-size="13" font-weight="700" fill="#D64309">candidate</text>
    <text x="820" y="636" text-anchor="middle" font-size="13" font-weight="700" fill="#D64309">upstream edge</text>
  </g>

  <!-- ==== Legend ==== -->
  <g transform="translate(60, 660)">
    <rect x="0" y="0" width="220" height="160" rx="10" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="2"/>
    <text x="12" y="24" font-size="13" font-weight="700" fill="#0033A0" letter-spacing="0.05em">LEGEND</text>

    <rect x="12" y="38" width="22" height="14" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <text x="42" y="50" font-size="12" fill="#3F4444">Known risk factor (rediscovered)</text>

    <rect x="12" y="62" width="22" height="14" fill="#D64309" stroke="#D64309" stroke-width="2"/>
    <text x="42" y="74" font-size="12" fill="#3F4444">Candidate / flagged</text>

    <circle cx="23" cy="94" r="8" fill="#ffffff" stroke="#0033A0" stroke-width="2.5"/>
    <circle cx="23" cy="94" r="5" fill="#ffffff" stroke="#0033A0" stroke-width="1.5"/>
    <text x="42" y="98" font-size="12" fill="#3F4444">Outcome (double-ring)</text>

    <line x1="12" y1="118" x2="34" y2="118" stroke="#D64309" stroke-width="4"/>
    <text x="42" y="122" font-size="12" fill="#3F4444">Candidate upstream edge</text>

    <line x1="12" y1="140" x2="34" y2="140" stroke="#005DAA" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="42" y="144" font-size="12" fill="#3F4444">Likely confounder path</text>
  </g>
</svg>
