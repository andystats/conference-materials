<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24in" height="12in" viewBox="0 0 2400 1200" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowNavy" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <polygon points="0 0, 5 2.5, 0 5" fill="#005DAA"/>
    </marker>
    <marker id="arrowInk" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <polygon points="0 0, 4 2, 0 4" fill="#3F4444"/>
    </marker>
    <marker id="arrowOrange" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <polygon points="0 0, 5 2.5, 0 5" fill="#D64309"/>
    </marker>
  </defs>

  <!-- ============ LEFT PANEL: FLAT TABLE ============ -->
  <g id="flatPanel">
    <!-- Panel title -->
    <text x="460" y="80" text-anchor="middle" font-size="46" font-weight="700" fill="#3F4444">Flat EHR table</text>
    <text x="460" y="130" text-anchor="middle" font-size="28" fill="#3F4444" font-style="italic">one row per admission</text>

    <!-- Table frame -->
    <rect x="90" y="180" width="740" height="820" rx="10" fill="#ffffff" stroke="#CDCDCD" stroke-width="4"/>

    <!-- Header row -->
    <rect x="90" y="180" width="740" height="80" fill="#0033A0"/>
    <text x="150" y="230" font-size="24" font-weight="700" fill="#ffffff">subject_id</text>
    <text x="280" y="230" font-size="24" font-weight="700" fill="#ffffff">age</text>
    <text x="380" y="230" font-size="24" font-weight="700" fill="#ffffff">albumin</text>
    <text x="520" y="230" font-size="24" font-weight="700" fill="#ffffff">mech_vent</text>
    <text x="670" y="230" font-size="24" font-weight="700" fill="#ffffff">HAPrI</text>

    <!-- Data rows -->
    <g font-size="24" fill="#3F4444">
      <g>
        <rect x="90" y="260" width="740" height="64" fill="#ffffff"/>
        <text x="150" y="302">10012</text>
        <text x="280" y="302">68</text>
        <text x="380" y="302">2.4</text>
        <text x="520" y="302">1</text>
        <text x="670" y="302">1</text>
      </g>
      <g>
        <rect x="90" y="324" width="740" height="64" fill="#F6F8FC"/>
        <text x="150" y="366">10338</text>
        <text x="280" y="366">74</text>
        <text x="380" y="366">3.1</text>
        <text x="520" y="366">0</text>
        <text x="670" y="366">0</text>
      </g>
      <g>
        <rect x="90" y="388" width="740" height="64" fill="#ffffff"/>
        <text x="150" y="430">10551</text>
        <text x="280" y="430">62</text>
        <text x="380" y="430">2.7</text>
        <text x="520" y="430">1</text>
        <text x="670" y="430">1</text>
      </g>
      <g>
        <rect x="90" y="452" width="740" height="64" fill="#F6F8FC"/>
        <text x="150" y="494">10709</text>
        <text x="280" y="494">81</text>
        <text x="380" y="494">3.4</text>
        <text x="520" y="494">0</text>
        <text x="670" y="494">0</text>
      </g>
      <g>
        <rect x="90" y="516" width="740" height="64" fill="#ffffff"/>
        <text x="150" y="558">10863</text>
        <text x="280" y="558">57</text>
        <text x="380" y="558">2.2</text>
        <text x="520" y="558">1</text>
        <text x="670" y="558">1</text>
      </g>
      <g>
        <rect x="90" y="580" width="740" height="64" fill="#F6F8FC"/>
        <text x="150" y="622">11024</text>
        <text x="280" y="622">70</text>
        <text x="380" y="622">3.6</text>
        <text x="520" y="622">0</text>
        <text x="670" y="622">0</text>
      </g>
      <g>
        <rect x="90" y="644" width="740" height="64" fill="#ffffff"/>
        <text x="150" y="686">11299</text>
        <text x="280" y="686">65</text>
        <text x="380" y="686">2.5</text>
        <text x="520" y="686">1</text>
        <text x="670" y="686">1</text>
      </g>
      <g>
        <rect x="90" y="708" width="740" height="64" fill="#F6F8FC"/>
        <text x="150" y="750">11478</text>
        <text x="280" y="750">73</text>
        <text x="380" y="750">3.0</text>
        <text x="520" y="750">0</text>
        <text x="670" y="750">0</text>
      </g>
      <g>
        <rect x="90" y="772" width="740" height="64" fill="#ffffff"/>
        <text x="150" y="814">11641</text>
        <text x="280" y="814">78</text>
        <text x="380" y="814">2.3</text>
        <text x="520" y="814">1</text>
        <text x="670" y="814">1</text>
      </g>
      <g>
        <rect x="90" y="836" width="740" height="64" fill="#F6F8FC"/>
        <text x="150" y="878">11852</text>
        <text x="280" y="878">69</text>
        <text x="380" y="878">3.3</text>
        <text x="520" y="878">0</text>
        <text x="670" y="878">0</text>
      </g>
      <text x="460" y="960" text-anchor="middle" font-size="40" fill="#CDCDCD">· · ·</text>
    </g>

    <!-- Diagonal slash (gray, not red) through the table -->
    <line x1="120" y1="200" x2="800" y2="980" stroke="#CDCDCD" stroke-width="14" stroke-linecap="round" opacity="0.78"/>
    <line x1="800" y1="200" x2="120" y2="980" stroke="#CDCDCD" stroke-width="14" stroke-linecap="round" opacity="0.78"/>

    <!-- Caption under the table -->
    <g transform="translate(460, 1080)">
      <rect x="-350" y="-40" width="700" height="90" rx="10" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-size="32" font-weight="700" fill="#3F4444">Temporal order lost</text>
      <text x="0" y="32" text-anchor="middle" font-size="24" fill="#3F4444" font-style="italic">clocks collapsed into a single row</text>
    </g>
  </g>

  <!-- ============ MIDDLE: RESHAPE ARROW ============ -->
  <g id="reshape">
    <rect x="900" y="540" width="360" height="160" rx="80" fill="#ffffff" stroke="#005DAA" stroke-width="5"/>
    <text x="1080" y="610" text-anchor="middle" font-size="38" font-weight="700" fill="#0033A0">object-centric</text>
    <text x="1080" y="660" text-anchor="middle" font-size="38" font-weight="700" fill="#0033A0">reshape</text>
    <!-- Big arrow -->
    <line x1="870" y1="620" x2="920" y2="620" stroke="#005DAA" stroke-width="10"/>
    <line x1="1240" y1="620" x2="1300" y2="620" stroke="#005DAA" stroke-width="10" marker-end="url(#arrowNavy)"/>
  </g>

  <!-- ============ RIGHT PANEL: OBJECT-CENTRIC GRAPH ============ -->
  <g id="objectPanel">
    <text x="1870" y="80" text-anchor="middle" font-size="46" font-weight="700" fill="#3F4444">Object-centric graph</text>
    <text x="1870" y="130" text-anchor="middle" font-size="28" fill="#3F4444" font-style="italic">temporal objects with relational edges</text>

    <!-- Admission node (root) -->
    <g id="admNode">
      <rect x="1340" y="240" width="260" height="110" rx="14" fill="#0033A0" stroke="#0033A0" stroke-width="3"/>
      <text x="1470" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Admission</text>
      <text x="1470" y="325" text-anchor="middle" font-size="22" fill="#ffffff" opacity="0.85">t = 0h</text>
    </g>

    <!-- ICU stay node -->
    <g id="icuNode">
      <rect x="1700" y="240" width="260" height="110" rx="14" fill="#0033A0" stroke="#0033A0" stroke-width="3"/>
      <text x="1830" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">ICU stay</text>
      <text x="1830" y="325" text-anchor="middle" font-size="22" fill="#ffffff" opacity="0.85">t + 2h</text>
    </g>

    <!-- Edge: admission -> ICU -->
    <line x1="1600" y1="295" x2="1700" y2="295" stroke="#005DAA" stroke-width="5" marker-end="url(#arrowNavy)"/>

    <!-- Branching nodes from ICU stay -->
    <!-- Procedures -->
    <g id="procNode">
      <rect x="1380" y="470" width="280" height="110" rx="14" fill="#ffffff" stroke="#005DAA" stroke-width="4"/>
      <text x="1520" y="514" text-anchor="middle" font-size="26" font-weight="700" fill="#0033A0">Procedures</text>
      <text x="1520" y="548" text-anchor="middle" font-size="20" fill="#3F4444" font-style="italic">intubation · catheter</text>
    </g>
    <!-- Medications -->
    <g id="medNode">
      <rect x="1700" y="470" width="280" height="110" rx="14" fill="#ffffff" stroke="#005DAA" stroke-width="4"/>
      <text x="1840" y="514" text-anchor="middle" font-size="26" font-weight="700" fill="#0033A0">Medications</text>
      <text x="1840" y="548" text-anchor="middle" font-size="20" fill="#3F4444" font-style="italic">pressors · diuretics</text>
    </g>
    <!-- Labs -->
    <g id="labNode">
      <rect x="2020" y="470" width="280" height="110" rx="14" fill="#ffffff" stroke="#005DAA" stroke-width="4"/>
      <text x="2160" y="514" text-anchor="middle" font-size="26" font-weight="700" fill="#0033A0">Labs</text>
      <text x="2160" y="548" text-anchor="middle" font-size="20" fill="#3F4444" font-style="italic">CBC · chem panel</text>
    </g>

    <!-- Edges ICU -> children -->
    <line x1="1820" y1="355" x2="1560" y2="465" stroke="#005DAA" stroke-width="4" marker-end="url(#arrowNavy)"/>
    <line x1="1830" y1="355" x2="1830" y2="465" stroke="#005DAA" stroke-width="4" marker-end="url(#arrowNavy)"/>
    <line x1="1840" y1="355" x2="2110" y2="465" stroke="#005DAA" stroke-width="4" marker-end="url(#arrowNavy)"/>

    <!-- Grandchildren: albumin lab event (HIGHLIGHTED ORANGE) -->
    <g id="albNode">
      <rect x="2020" y="700" width="280" height="130" rx="14" fill="#D64309" stroke="#D64309" stroke-width="3"/>
      <text x="2160" y="744" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Albumin lab</text>
      <text x="2160" y="776" text-anchor="middle" font-size="20" fill="#ffffff" opacity="0.95">value = 2.4 g/dL  ·  t + 18h</text>
      <text x="2160" y="808" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.9" font-style="italic">flagged for focused evaluation</text>
    </g>
    <line x1="2160" y1="585" x2="2160" y2="695" stroke="#D64309" stroke-width="6" marker-end="url(#arrowOrange)"/>

    <!-- Secondary lab chain (creatinine, illustrative) -->
    <g id="moreLabs">
      <rect x="1700" y="700" width="280" height="110" rx="14" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="1840" y="744" text-anchor="middle" font-size="24" fill="#3F4444" font-style="italic">Creatinine</text>
      <text x="1840" y="776" text-anchor="middle" font-size="20" fill="#3F4444" opacity="0.7">t + 12h · 24h · 36h</text>
      <line x1="1840" y1="585" x2="1840" y2="695" stroke="#CDCDCD" stroke-width="4" stroke-dasharray="8 8"/>
    </g>
    <!-- Secondary procedure chain (illustrative) -->
    <g id="moreLabs2">
      <rect x="1380" y="700" width="280" height="110" rx="14" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="3" stroke-dasharray="8 8"/>
      <text x="1520" y="744" text-anchor="middle" font-size="24" fill="#3F4444" font-style="italic">Proc: turn Q2h</text>
      <text x="1520" y="776" text-anchor="middle" font-size="20" fill="#3F4444" opacity="0.7">t + 8h · 10h · 12h</text>
      <line x1="1520" y1="585" x2="1520" y2="695" stroke="#CDCDCD" stroke-width="4" stroke-dasharray="8 8"/>
    </g>

    <!-- Outcome: HAPrI node (double-ringed for outcome semantics) -->
    <g id="outNode">
      <rect x="1690" y="900" width="300" height="130" rx="16" fill="#ffffff" stroke="#0033A0" stroke-width="6"/>
      <rect x="1706" y="916" width="268" height="98" rx="10" fill="#ffffff" stroke="#0033A0" stroke-width="3"/>
      <text x="1840" y="960" text-anchor="middle" font-size="30" font-weight="700" fill="#0033A0">HAPrI</text>
      <text x="1840" y="992" text-anchor="middle" font-size="20" fill="#3F4444">outcome</text>
    </g>
    <line x1="1840" y1="815" x2="1840" y2="895" stroke="#005DAA" stroke-width="4" marker-end="url(#arrowNavy)"/>
    <line x1="2080" y1="835" x2="1970" y2="898" stroke="#D64309" stroke-width="5" marker-end="url(#arrowOrange)"/>

    <!-- Caption -->
    <g transform="translate(1870, 1060)">
      <rect x="-430" y="0" width="860" height="128" rx="14" fill="#F6F8FC" stroke="#005DAA" stroke-width="3"/>
      <text x="0" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#0033A0">Time orients the edges.</text>
      <text x="0" y="82" text-anchor="middle" font-size="22" fill="#3F4444">Relational structure, timestamps, and missingness</text>
      <text x="0" y="112" text-anchor="middle" font-size="22" fill="#3F4444">are carried into the search — not discarded.</text>
    </g>
  </g>

  <!-- Legend strip along the bottom -->
  <g transform="translate(60, 1180)" font-size="18" fill="#3F4444">
    <rect x="0" y="-20" width="26" height="14" fill="#0033A0"/>
    <text x="36" y="-7">known temporal edge</text>
    <rect x="300" y="-20" width="26" height="14" fill="#D64309"/>
    <text x="336" y="-7">focused-evaluation node (albumin)</text>
    <rect x="840" y="-20" width="26" height="14" fill="#F6F8FC" stroke="#CDCDCD" stroke-width="2"/>
    <text x="876" y="-7">additional dependencies (illustrative)</text>
    <text x="2340" y="-7" text-anchor="end" font-style="italic" fill="#CDCDCD">MIMIC-IV v3.1 · schematic</text>
  </g>
</svg>
